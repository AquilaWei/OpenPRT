name: Release

# Publishes signed APKs for a version tag. Push the tag only after the version bump commit:
#   git tag v0.1.31 && git push origin v0.1.31
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Test release scripts
        run: scripts/test-release-scripts.sh

      - name: Verify
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug assembleDebug

      - name: Write release notes from CHANGELOG
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      # The keystore is stored base64-encoded because secrets are text. A published release
      # must be signed, so a missing secret fails here instead of uploading unsigned APKs.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENPRT_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret OPENPRT_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          OPENPRT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OPENPRT_KEYSTORE_PASSWORD: ${{ secrets.OPENPRT_KEYSTORE_PASSWORD }}
          OPENPRT_KEY_ALIAS: ${{ secrets.OPENPRT_KEY_ALIAS }}
          OPENPRT_KEY_PASSWORD: ${{ secrets.OPENPRT_KEY_PASSWORD }}
          # Optional. Anyone who downloads the APK can extract a built-in key, so leave
          # this secret unset unless the release is private; the app asks for a key instead.
          PRT_API_KEY: ${{ secrets.PRT_API_KEY }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs and write SHA256 files
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$apk" -release.apk)"
            cp "$apk" "dist/OpenPRT-${GITHUB_REF_NAME}-${abi#app-}.apk"
          done
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cd dist
          for apk in *.apk; do
            "$apksigner" verify "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -l

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "OpenPRT $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag
